[project]
name = "lastro"
version = "0.1.0"
description = "Organização, Autonomia, Segurança e Gestão financeira"
authors = [
  { name = "Cap1s", email = "arthur.capistrano12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "mypy>=2.4.0",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "types-beautifulsoup4>=4.12.0.20250516",
]
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["lastro", "tests"]
